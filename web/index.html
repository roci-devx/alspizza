<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Order Al's Pizza for pickup or delivery — hot, fresh and made your way.">
  <meta name="theme-color" content="#5A210F">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Al's Pizza">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Al's Pizza</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FCF7EC; }
    #als-loading { position: fixed; inset: 0; display: grid; place-items: center; background: #FCF7EC; transition: opacity .4s ease; }
    #als-loading img { width: 160px; animation: als-pop 1.2s ease-in-out infinite alternate; }
    @keyframes als-pop { from { transform: scale(.94); } to { transform: scale(1.04); } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="als-loading"><img src="icons/Icon-512.png" alt="Al's Pizza"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Fade the branded loader out once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('als-loading');
      if (l) { l.style.opacity = '0'; setTimeout(function () { l.remove(); }, 450); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
