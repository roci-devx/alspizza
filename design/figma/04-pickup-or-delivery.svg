</defs><g id="04 Pickup or delivery (skippable)"><rect width="390" height="844" fill="#FCF7EC"/><g id="Status bar"><text x="28" y="34" font-family="Nunito" font-size="16" font-weight="800" fill="#2E140A" text-anchor="start">9:41</text><rect x="310" y="24" width="18" height="11" rx="2" fill="#2E140A" opacity="0.9"/><rect x="334" y="23" width="26" height="13" rx="4" fill="none" stroke="#2E140A" stroke-width="1.5"/><rect x="337" y="26" width="18" height="7" rx="2" fill="#2E140A"/></g><text x="24" y="140" font-family="Fredoka" font-size="32" font-weight="700" fill="#5A210F" text-anchor="start">How do you want it?</text><text x="24" y="170" font-family="Nunito" font-size="15" font-weight="600" fill="#8C7462" text-anchor="start">From Lincoln Park · you can switch at checkout.</text><g id="Pickup card"><rect x="24" y="204" width="342" height="150" rx="28" fill="url(#gPrimary)" filter="url(#shadowStrong)"/><text x="46" y="270" font-family="Fredoka" font-size="30" font-weight="700" fill="#5A210F" text-anchor="start">Pickup</text><text x="46" y="298" font-family="Nunito" font-size="15" font-weight="700" fill="#5A210F" text-anchor="start">Ready in about 18 min</text><circle cx="300.0" cy="279.0" r="46.0" fill="#fff" opacity="0.35"/><path d="M6 7V6a6 6 0 0 1 12 0v1h3l-1 15H4L3 7zm2 0h8V6a4 4 0 0 0-8 0z" transform="translate(276,255) scale(2.000)" fill="#5A210F"/></g><g id="Delivery card"><rect x="24" y="374" width="342" height="150" rx="28" fill="url(#gBrown)" filter="url(#shadowStrong)"/><text x="46" y="440" font-family="Fredoka" font-size="30" font-weight="700" fill="#FCF7EC" text-anchor="start">Delivery</text><text x="46" y="468" font-family="Nunito" font-size="15" font-weight="700" fill="#FCF7EC" text-anchor="start" opacity="0.85">To 2230 N Lincoln Ave</text><circle cx="300.0" cy="449.0" r="46.0" fill="#fff" opacity="0.12"/><path d="M5 18a3 3 0 1 0 0-.1zM19 18a3 3 0 1 0 0-.1zM14 5h3l3 7h-4l-2 4H8l-3-5h7z" transform="translate(276,425) scale(2.000)" fill="#FCF7EC"/></g><text